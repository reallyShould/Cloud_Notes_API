version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: cloud_notes_db_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-main_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-main_db}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - cloud_notes_dev

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud_notes_api_dev
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-main_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
      - backend_uploads_dev:/code/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloud_notes_dev

  frontend:
    image: node:24-alpine
    container_name: cloud_notes_frontend_dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules_dev:/app/node_modules
    depends_on:
      - server
    networks:
      - cloud_notes_dev

volumes:
  postgres_data_dev:
  backend_uploads_dev:
  frontend_node_modules_dev:

networks:
  cloud_notes_dev:
    driver: bridge
