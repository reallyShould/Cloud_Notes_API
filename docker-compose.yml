version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: backend_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: main_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_server
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://admin:admin@db:5432/main_db"
      JWT_SECRET_KEY: "change-me-in-production"
      COOKIE_SECURE: "false"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      - ./backend:/code
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    image: node:24-alpine
    container_name: cloud_notes_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:8000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - server
    networks:
      - app-network
volumes:
  pgdata:
  frontend_node_modules:

networks:
  app-network:
    driver: bridge

